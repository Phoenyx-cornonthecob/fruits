<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Audio Classifier</title>
    
    <style>
        /* CSS Styling to make it look like a real website */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; 
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        button {
            background-color: #27ae60; /* Nice green */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
            width: 100%; 
        }

        button:hover {
            background-color: #2ecc71; 
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #label-container div {
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            color: #2c3e50;
            border-left: 5px solid #27ae60; 
            text-align: left;
        }
    </style>
</head>
<body>

    <main class="app-card">
        <h1>Fruit Audio Classifier</h1>
        <button id="start-btn" type="button" onclick="init()">Start Microphone</button>
        <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        // Your specific audio model link
        const URL = "https://teachablemachine.withgoogle.com/models/RfYC1FiD9/";

        async function createModel() {
            const checkpointURL = URL + "model.json"; // model topology
            const metadataURL = URL + "metadata.json"; // model metadata

            const recognizer = speechCommands.create(
                "BROWSER_FFT", // fourier transform type, not useful to change
                undefined, // speech commands vocabulary feature, not useful for your models
                checkpointURL,
                metadataURL);

            // check that model and metadata are loaded via HTTPS requests.
            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            // Disable the button so the user doesn't click it twice while loading
            const startBtn = document.getElementById("start-btn");
            startBtn.innerText = "Loading Model...";
            startBtn.disabled = true;

            try {
                const recognizer = await createModel();
                const classLabels = recognizer.wordLabels(); // get class labels
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; // Clear existing labels

                // Create a visual row for each class
                for (let i = 0; i < classLabels.length; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                // Change button text to indicate it's listening
                startBtn.innerText = "Listening...";

                // Start listening to the microphone
                recognizer.listen(result => {
                    const scores = result.scores; // probability of prediction for each class

                    // Update the labels with the live probability scores
                    for (let i = 0; i < classLabels.length; i++) {
                        const percentage = Math.round(scores[i] * 100);
                        const classPrediction = classLabels[i] + ": " + percentage + "%";
                        labelContainer.childNodes[i].innerHTML = classPrediction;
                    }
                }, {
                    includeSpectrogram: true, // in case listen should return result.spectrogram
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    overlapFactor: 0.50 // How often it checks the audio
                });

            } catch (error) {
                console.error("Error loading audio model:", error);
                alert("Make sure your model link is correct and public, and that you have granted microphone permissions!");
                startBtn.innerText = "Start Microphone";
                startBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
