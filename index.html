<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Audio Classifier</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.2); 
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative; 
            overflow: hidden;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #2c3e50; }
        button {
            background-color: #27ae60; color: white; border: none;
            padding: 12px 24px; font-size: 1rem; font-weight: bold;
            border-radius: 8px; cursor: pointer; margin-bottom: 20px; width: 100%; 
        }
        button:hover { background-color: #2ecc71; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* New Smooth Progress Bar Styles */
        #label-container { display: flex; flex-direction: column; gap: 12px; }
        .label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #ecf0f1; 
            padding: 10px 15px; 
            border-radius: 6px;
            border-left: 5px solid #27ae60;
        }
        .label-name {
            font-weight: bold; 
            color: #2c3e50;
            width: 90px;
            text-align: left;
            text-transform: capitalize;
        }
        .progress-bg {
            flex-grow: 1;
            height: 12px;
            background-color: #bdc3c7;
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            /* This transition is the secret to making it look incredibly smooth */
            transition: width 0.1s ease-out; 
        }
        .label-score {
            font-weight: bold;
            color: #2c3e50;
            width: 45px;
            text-align: right;
        }
        
        /* Popup Menu */
        #fruit-popup {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98); z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #fruit-emoji {
            font-size: 120px; 
            margin-bottom: 15px;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
        }
        #fruit-popup-text { font-size: 1.5rem; font-weight: bold; color: #27ae60; text-transform: uppercase; }
    </style>
</head>
<body>

    <main class="app-card">
        <div id="fruit-popup" style="display: none;">
            <div id="fruit-emoji">🍎</div>
            <div id="fruit-popup-text">Fruit Saved!</div>
        </div>

        <h1>Fruit Audio Classifier</h1>
        <button id="start-btn" type="button" onclick="init()">Start Microphone</button>
        <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/RfYC1FiD9/";
        let isShowingImage = false;

        const fruitEmojis = {
            "apple": "🍎",
            "banana": "🍌",
            "orange": "🍊",
            "strawberry": "🍓",
            "grape": "🍇",
            "watermelon": "🍉",
            "default": "🌟"
        };

        async function createModel() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 
            const recognizer = speechCommands.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const startBtn = document.getElementById("start-btn");
            startBtn.innerText = "Loading Model...";
            startBtn.disabled = true;

            try {
                const recognizer = await createModel();
                const rawClassLabels = recognizer.wordLabels(); 
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; 

                const classLabels = [];
                
                // Build the new UI rows with progress bars
                for (let i = 0; i < rawClassLabels.length; i++) {
                    let labelName = rawClassLabels[i];
                    if (labelName === "Background Noise") {
                        labelName = "Apple"; 
                    }
                    classLabels.push(labelName);

                    const row = document.createElement("div");
                    row.className = "label-row";
                    row.innerHTML = `
                        <div class="label-name">${labelName}</div>
                        <div class="progress-bg">
                            <div class="progress-fill" id="fill-${i}"></div>
                        </div>
                        <div class="label-score" id="score-${i}">0%</div>
                    `;
                    labelContainer.appendChild(row);
                }

                startBtn.innerText = "Listening...";

                recognizer.listen(result => {
                    const scores = result.scores; 
                    let highestIndex = 0;
                    let highestScore = 0;

                    for (let i = 0; i < classLabels.length; i++) {
                        const percentage = Math.round(scores[i] * 100);
                        
                        // Update the text AND the smooth progress bar fill
                        document.getElementById(`score-${i}`).innerText = percentage + "%";
                        document.getElementById(`fill-${i}`).style.width = percentage + "%";

                        if (scores[i] > highestScore) {
                            highestScore = scores[i];
                            highestIndex = i;
                        }
                    }

                    const topClass = classLabels[highestIndex];
                    const isNoise = topClass.toLowerCase().includes("real background noise");

                    // 95% threshold to block out silence
                    if (highestScore > 0.95 && !isShowingImage && !isNoise) {
                        showFruitPopup(topClass);
                    }

                }, {
                    includeSpectrogram: true, 
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    // INCREASED OVERLAP FACTOR: Makes the AI check the mic much faster!
                    overlapFactor: 0.85 
                });

            } catch (error) {
                console.error("Error:", error);
                alert("Mic access denied or model failed to load. Please check browser permissions!");
                startBtn.innerText = "Start Microphone";
                startBtn.disabled = false;
            }
        }

        function showFruitPopup(fruitName) {
            isShowingImage = true;
            const popup = document.getElementById("fruit-popup");
            const emojiDiv = document.getElementById("fruit-emoji");
            const text = document.getElementById("fruit-popup-text");

            const safeName = fruitName.toLowerCase().trim();
            const emoji = fruitEmojis[safeName] || fruitEmojis["default"];
            
            emojiDiv.innerText = emoji;
            text.innerText = `💥 ${fruitName} Saved!`;
            
            popup.style.display = "flex"; 

            setTimeout(() => {
                popup.style.display = "none";
                isShowingImage = false;
            }, 2000);
        }
    </script>
</body>
</html>
