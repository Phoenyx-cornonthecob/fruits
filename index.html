<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Audio Classifier</title>
    
    <style>
        /* CSS Styling to make it look like a real website */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Added a fun, high-quality fruit background */
            background-image: url('https://images.unsplash.com/photo-1490818387583-1b5f222129d1?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            /* Changed to slightly transparent white so the background peeks through */
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3); 
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative; 
            overflow: hidden;
            backdrop-filter: blur(5px); /* Adds a cool frosted glass effect */
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        button {
            background-color: #27ae60; 
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
            width: 100%; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #2ecc71; 
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #label-container div {
            background-color: rgba(236, 240, 241, 0.9);
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            color: #2c3e50;
            border-left: 5px solid #27ae60; 
            text-align: left;
        }

        /* Dramatic Saved Fruit Popup Menu */
        #fruit-popup {
            display: none; 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #fruit-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 4px solid #27ae60;
        }

        #fruit-popup-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main class="app-card">
        <div id="fruit-popup">
            <img id="fruit-img" src="" alt="Saved Fruit">
            <div id="fruit-popup-text">Fruit Saved!</div>
        </div>

        <h1>Fruit Audio Classifier</h1>
        <button id="start-btn" type="button" onclick="init()">Start Microphone</button>
        <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/RfYC1FiD9/";

        let isShowingImage = false;

        // DICTIONARY: Map your fruit names to high-quality images here.
        // If you add new fruits to your model, add their exact name and an image link here!
        const fruitImages = {
            "Apple": "https://images.unsplash.com/photo-1560806887-1e4cd0b6faa6?w=400&q=80",
            "Banana": "https://images.unsplash.com/photo-1571501478200-8d96f9a0d8e9?w=400&q=80",
            "Orange": "https://images.unsplash.com/photo-1611080626919-7cf5a9dbab5b?w=400&q=80",
            "Strawberry": "https://images.unsplash.com/photo-1464965911861-746a04b4bca6?w=400&q=80",
            "Grape": "https://images.unsplash.com/photo-1596365548074-e85d4d3d52cb?w=400&q=80",
            "Watermelon": "https://images.unsplash.com/photo-1589984662646-e7b2e4962f18?w=400&q=80",
            // A generic fruit basket fallback just in case it detects a fruit not listed above
            "Default": "https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=400&q=80"
        };

        async function createModel() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            const recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined, 
                checkpointURL,
                metadataURL);

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const startBtn = document.getElementById("start-btn");
            startBtn.innerText = "Loading Model...";
            startBtn.disabled = true;

            try {
                const recognizer = await createModel();
                const rawClassLabels = recognizer.wordLabels(); 
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; 

                // Create our fixed labels list (changing "Background Noise" to "Apple")
                const classLabels = [];
                for (let i = 0; i < rawClassLabels.length; i++) {
                    let labelName = rawClassLabels[i];
                    if (labelName === "Background Noise") {
                        labelName = "Apple"; // Fixes the Teachable Machine default error
                    }
                    classLabels.push(labelName);
                    labelContainer.appendChild(document.createElement("div"));
                }

                startBtn.innerText = "Listening...";

                recognizer.listen(result => {
                    const scores = result.scores; 

                    let highestIndex = 0;
                    let highestScore = 0;

                    // Loop through and update the screen with our fixed class labels
                    for (let i = 0; i < classLabels.length; i++) {
                        const percentage = Math.round(scores[i] * 100);
                        const classPrediction = classLabels[i] + ": " + percentage + "%";
                        labelContainer.childNodes[i].innerHTML = classPrediction;

                        if (scores[i] > highestScore) {
                            highestScore = scores[i];
                            highestIndex = i;
                        }
                    }

                    const topClass = classLabels[highestIndex];
                    
                    // Filter out the actual background noise you recorded
                    const isNoise = topClass.toLowerCase().includes("real background noise");

                    // Trigger if the match is confident (>80%), is NOT the real noise, and isn't on cooldown
                    if (highestScore > 0.80 && !isShowingImage && !isNoise) {
                        showFruitPopup(topClass);
                    }

                }, {
                    includeSpectrogram: true, 
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    overlapFactor: 0.50 
                });

            } catch (error) {
                console.error("Error loading audio model:", error);
                alert("Make sure your model link is correct and public, and that you have granted microphone permissions!");
                startBtn.innerText = "Start Microphone";
                startBtn.disabled = false;
            }
        }

        function showFruitPopup(fruitName) {
            isShowingImage = true;
            const popup = document.getElementById("fruit-popup");
            const img = document.getElementById("fruit-img");
            const text = document.getElementById("fruit-popup-text");

            // Look up the specific image in our dictionary. If it doesn't exist, use the Default image.
            const imageUrl = fruitImages[fruitName] || fruitImages["Default"];
            
            img.src = imageUrl;
            text.innerText = `💥 ${fruitName} Saved!`;
            
            popup.style.display = "flex"; 

            // Auto dismisses exactly 2 seconds later
            setTimeout(() => {
                popup.style.display = "none";
                isShowingImage = false;
            }, 2000);
        }
    </script>
</body>
</html>
