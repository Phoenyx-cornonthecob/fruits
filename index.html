<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Classifier</title>
    
    <style>
        /* CSS Styling to make it look like a real website */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; 
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        button {
            background-color: #27ae60; /* Changed to a nice green for fruits */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
            width: 100%; 
        }

        button:hover {
            background-color: #2ecc71; 
        }

        #webcam-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #e9ecef; 
            min-height: 200px; 
            align-items: center;
        }

        #webcam-container canvas {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #label-container div {
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            color: #2c3e50;
            border-left: 5px solid #27ae60; 
            text-align: left;
        }
    </style>
</head>
<body>

    <main class="app-card">
        <h1>Fruit Classifier</h1>
        <button type="button" onclick="init()">Start Camera</button>
        <div id="webcam-container"></div>
        <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        // Your specific model link
        const URL = "https://teachablemachine.withgoogle.com/models/RfYC1FiD9/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                // Load the model and metadata from your Google link
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Setup the webcam
                const flip = true; 
                webcam = new tmImage.Webcam(200, 200, flip); 
                await webcam.setup(); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                // Add webcam to the screen
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                
                // Setup labels
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; // Clear out previous labels if any
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            } catch (error) {
                console.error("Error loading model:", error);
                alert("Make sure your model link is correct and public!");
            }
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // predict can take in an image, video or canvas html element
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const percentage = Math.round(prediction[i].probability * 100);
                const classPrediction = prediction[i].className + ": " + percentage + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
