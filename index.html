<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Audio Classifier</title>
    
    <style>
        /* CSS Styling to make it look like a real website */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; 
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1); 
            text-align: center;
            max-width: 450px;
            width: 100%;
            position: relative; /* Crucial for positioning the pop-up over the card */
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        button {
            background-color: #27ae60; /* Nice fruit green */
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
            width: 100%; 
        }

        button:hover {
            background-color: #2ecc71; 
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #label-container div {
            background-color: #ecf0f1;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            color: #2c3e50;
            border-left: 5px solid #27ae60; 
            text-align: left;
        }

        /* Dramatic Saved Fruit Popup Menu */
        #fruit-popup {
            display: none; /* Hidden by default */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #fruit-img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            border: 4px solid #27ae60;
        }

        #fruit-popup-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #27ae60;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <main class="app-card">
        <div id="fruit-popup" style="display: none;">
            <img id="fruit-img" src="" alt="Saved Fruit">
            <div id="fruit-popup-text">Fruit Saved!</div>
        </div>

        <h1>Fruit Audio Classifier</h1>
        <button id="start-btn" type="button" onclick="init()">Start Microphone</button>
        <div id="label-container"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/RfYC1FiD9/";

        let isShowingImage = false; // Cooldown lock to keep it from glitching out

        async function createModel() {
            const checkpointURL = URL + "model.json"; 
            const metadataURL = URL + "metadata.json"; 

            const recognizer = speechCommands.create(
                "BROWSER_FFT", 
                undefined, 
                checkpointURL,
                metadataURL);

            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const startBtn = document.getElementById("start-btn");
            startBtn.innerText = "Loading Model...";
            startBtn.disabled = true;

            try {
                const recognizer = await createModel();
                const classLabels = recognizer.wordLabels(); 
                const labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ""; 

                for (let i = 0; i < classLabels.length; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }

                startBtn.innerText = "Listening...";

                recognizer.listen(result => {
                    const scores = result.scores; 

                    let highestIndex = 0;
                    let highestScore = 0;

                    // Update live accuracy bar updates
                    for (let i = 0; i < classLabels.length; i++) {
                        const percentage = Math.round(scores[i] * 100);
                        const classPrediction = classLabels[i] + ": " + percentage + "%";
                        labelContainer.childNodes[i].innerHTML = classPrediction;

                        // Check which fruit sound matches the loudest
                        if (scores[i] > highestScore) {
                            highestScore = scores[i];
                            highestIndex = i;
                        }
                    }

                    const topClass = classLabels[highestIndex];
                    
                    // Filter out standard background hums or noise words
                    const isNoise = topClass.toLowerCase().includes("noise") || topClass.toLowerCase().includes("background");

                    // Trigger if the match is confident (>80%), not idle noise, and screen isn't already frozen
                    if (highestScore > 0.80 && !isShowingImage && !isNoise) {
                        showFruitPopup(topClass);
                    }

                }, {
                    includeSpectrogram: true, 
                    probabilityThreshold: 0.75,
                    invokeCallbackOnNoiseAndUnknown: true,
                    overlapFactor: 0.50 
                });

            } catch (error) {
                console.error("Error loading audio model:", error);
                alert("Make sure your model link is correct and public, and that you have granted microphone permissions!");
                startBtn.innerText = "Start Microphone";
                startBtn.disabled = false;
            }
        }

        // Handles displaying the popup and taking it down 2 seconds later
        function showFruitPopup(fruitName) {
            isShowingImage = true;
            const popup = document.getElementById("fruit-popup");
            const img = document.getElementById("fruit-img");
            const text = document.getElementById("fruit-popup-text");

            // Pulls a fresh image instantly using the target fruit label word
            img.src = `https://loremflickr.com/300/300/${encodeURIComponent(fruitName)}`;
            text.innerText = `💥 ${fruitName} Saved!`;
            
            popup.style.display = "flex"; // Reveals screen layout

            // Auto dismisses exactly 2 seconds (2000ms) later
            setTimeout(() => {
                popup.style.display = "none";
                isShowingImage = false;
            }, 2000);
        }
    </script>
</body>
</html>
